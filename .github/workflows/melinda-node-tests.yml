# Melinda node tests

name: Melinda node tests

on: push

jobs:
  build-node-versions:
    name: Node version matrix
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout the code
      uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
      env:
        NPM_CONFIG_IGNORE_SCRIPTS: true
    - run: npm audit --package-lock-only --production --audit-level=high
    - run: npm ci
    - run: npm test
    - run: npm run build --if-present

  license-scan:
    name: License compliance check
    runs-on: ubuntu-latest
    container: node:24

    steps:
      - uses: actions/checkout@v7
      - uses: mikaelvesavuori/license-compliance-action@v1
        with:
          # Defaults (MIT;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;Apache-2.0) plus
          # MIT-0 (nodemailer, via @natlibfi/melinda-backend-commons) and
          # BlueOak-1.0.0 (sax, via @xmldom/xmldom). Note the input replaces
          # the default list, so the defaults are repeated explicitly.
          allow_licenses: MIT;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;Apache-2.0;MIT-0;BlueOak-1.0.0
          # sylvester is excluded: its package.json has no license field, so
          # the scanner reports UNKNOWN, but it ships the verbatim MIT text
          # in LICENSE.txt (repo: github.com/jcreeks/sylvester.js, MIT).
          # False positive, not an unlicensed package.
          exclude_pattern: /^@natlibfi/;sylvester

  njsscan:
    name: Njsscan check
    runs-on: ubuntu-latest
    container: node:24

    steps:
    - name: Checkout the code
      uses: actions/checkout@v7
    - name: nodejsscan scan
      id: njsscan
      uses: ajinabraham/njsscan-action@master
      with:
        args: '.'

  openshift-webhook:
    name: OpenShift webhook for image builder
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    needs: [build-node-versions, njsscan]
    runs-on: ubuntu-latest
    container: node:24

    steps:
      - name: Production bib webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/main'
        with:
          url: ${{ secrets.WEBHOOK_URL_BIB_PROD_FROM_MAIN }}
          body: '{}'
      - name: Production aut-aux webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/main'
        with:
          url: ${{ secrets.WEBHOOK_URL_AUT_AUX_PROD_FROM_MAIN }}
          body: '{}'
      - name: Production aut-names webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/main'
        with:
          url: ${{ secrets.WEBHOOK_URL_AUT_NAMES_PROD_FROM_MAIN }}
          body: '{}'
      - name: Production aut-subjects webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/main'
        with:
          url: ${{ secrets.WEBHOOK_URL_AUT_SUBJECTS_PROD_FROM_MAIN }}
          body: '{}'
      - name: Production aut-works webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/main'
        with:
          url: ${{ secrets.WEBHOOK_URL_AUT_WORKS_PROD_FROM_MAIN }}
          body: '{}'
      - name: Test aut aux webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/test'
        with:
          url: ${{ secrets.WEBHOOK_URL_AUT_AUX_TEST_FROM_TEST }}
          body: '{}'
      - name: Test aut names webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/test'
        with:
          url: ${{ secrets.WEBHOOK_URL_AUT_NAMES_TEST_FROM_TEST }}
          body: '{}'
      - name: Test aut subjects webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/test'
        with:
          url: ${{ secrets.WEBHOOK_URL_AUT_SUBJECTS_TEST_FROM_TEST }}
          body: '{}'
      - name: Test aut works webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/test'
        with:
          url: ${{ secrets.WEBHOOK_URL_AUT_WORKS_TEST_FROM_TEST }}
          body: '{}'
      - name: Test bib webhook
        uses: joelwmale/webhook-action@v2
        if: github.ref == 'refs/heads/test'
        with:
          url: ${{ secrets.WEBHOOK_URL_BIB_TEST_FROM_TEST }}
          body: '{}'

